<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soccer tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9fb;--ink:#1d2a33;--muted:#5d6b75;--line:#c9d3db;--card:#fff;--accent:#2c5f86;--tint:rgba(44,95,134,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141a1f;--ink:#e7edf2;--muted:#9aa8b3;--line:#35414a;--card:#1b232a;--accent:#a9cdea;--tint:rgba(169,205,234,.10)}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Source Sans 3",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;overflow-x:hidden}

/* The hub is a pitch's centre circle: halfway line across the page, tools sit on the ring */
.pitch{position:relative;width:100%;display:flex;justify-content:center;padding:28px 0}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--line)}
.hub{--size:min(92vw,560px);--node:clamp(104px,28vw,150px);--R:calc(var(--size)/2 - var(--node)/2);
  position:relative;width:var(--size);height:var(--size)}
.ring{position:absolute;inset:calc(var(--node)/2);border:2px solid var(--line);border-radius:50%;background:var(--bg)}
.hub{--in:calc(var(--size) * .2)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:calc(var(--in) * 2)}
.center h1{margin:0;font:700 clamp(1.5rem,6vw,2.4rem)/1 "Barlow Condensed","Arial Narrow",sans-serif}
.center p{margin:.3rem 0 0;color:var(--muted);font-size:clamp(.78rem,2.6vw,.92rem)}

.node{position:absolute;left:50%;top:50%;width:var(--node);height:var(--node);margin:calc(var(--node)/-2) 0 0 calc(var(--node)/-2);
  transform:rotate(var(--a)) translate(var(--R)) rotate(calc(-1 * var(--a)));
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;
  border-radius:50%;background:var(--card);border:2px solid var(--line);color:inherit;text-decoration:none;
  transition:border-color .15s,background-color .15s}
.node:hover,.node:focus-visible{border-color:var(--accent);background:var(--tint)}
.node:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.node .icon{font-size:clamp(1.3rem,5vw,1.8rem);line-height:1;margin-bottom:4px}
.node .name{font:700 clamp(1.05rem,4.2vw,1.45rem)/1 "Barlow Condensed","Arial Narrow",sans-serif}
.node .what{color:var(--muted);font-size:clamp(.72rem,2.5vw,.85rem);margin-top:3px}
.node:hover .name,.node:focus-visible .name{color:var(--accent)}

@media (prefers-reduced-motion:no-preference){
  .node{animation:out .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms)}
  @keyframes out{from{transform:rotate(var(--a)) translate(0) rotate(calc(-1 * var(--a))) scale(.4);opacity:0}}
}
.note{max-width:34rem;margin:0 20px 28px;text-align:center;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<div class="pitch">
  <nav class="hub" aria-label="Soccer tools">
    <div class="ring" aria-hidden="true"></div>
    <!-- One node per tool; spread --a evenly around 360deg (3 tools: -90, 30, 150; 4 tools: -90, 0, 90, 180) -->
    <div class="center"><h1>Soccer tools</h1><p>FC Westlake</p></div>
    <a class="node" href="fcw-gu12-white/" style="--a:-90deg;--i:0">
      <span class="icon" aria-hidden="true">📊</span><span class="name">GU12 White</span><span class="what">Season tracker</span></a>
    <a class="node" href="tournament/" style="--a:30deg;--i:1">
      <span class="icon" aria-hidden="true">🏆</span><span class="name">Tournament</span><span class="what">Brackets and round-robin</span></a>
    <a class="node" href="camp/" style="--a:150deg;--i:2">
      <span class="icon" aria-hidden="true">🎽</span><span class="name">Camp</span><span class="what">Rosters, teams, scores</span></a>
  </nav>
</div>
<p class="note">The tournament and camp tools save what you enter on this device only. Nothing typed into them is shared or uploaded.</p>
</body>
</html>
