<!DOCTYPE html>
<html lang="en">

<title>Soccer tools</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f7f9fb;--ink:#1d2a33;--muted:#5d6b75;--line:#c9d3db;--accent:#2c5f86;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141a1f;--ink:#e7edf2;--muted:#9aa8b3;--line:#35414a;--accent:#5b8db5}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Source Sans 3",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;overflow-x:hidden}
.pitch{position:relative;width:100%;display:flex;justify-content:center;padding:28px 0}
.pitch::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--line)}
svg.ball{position:relative;width:min(90vw,78vh,600px);height:auto;overflow:visible}
.ballbg{fill:#fff;stroke:#1d2a33;stroke-width:.012}
.hex{fill:hsl(210 20% calc(var(--s) * 100%));stroke:#1d2a33;stroke-width:.012;stroke-linejoin:round}
.pent{fill:hsl(205 28% calc(var(--s) * 14%));stroke:#1d2a33;stroke-width:.012;stroke-linejoin:round}
.labels text{fill:#1d2a33;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tool .hex{transition:fill .15s}
.tool .hex{cursor:pointer}
.tool:hover .hex,.tool:focus-visible .hex{fill:#d3e3f1}
.tool:focus{outline:none}
.tool:focus-visible .hex{stroke:#2c5f86;stroke-width:.03}
.gloss{pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:roll .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes roll{from{transform:rotate(-80deg) scale(.85);opacity:0}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{max-width:34rem;margin:0 20px 28px;text-align:center;color:var(--muted);font-size:.88rem}
</style>
</head>
