<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC Westlake Elite Central White GU12 — Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f9fb; --ink:#1d2a33; --muted:#5d6b75; --line:#dbe2e8; --card:#ffffff;
  --win:#d6f0dc; --win-ink:#1f6a36;
  --loss:#f7d9d9; --loss-ink:#8f2626;
  --draw:#efe6d2; --draw-ink:#6e5a2c;
  --next:#ffffff; --next-edge:#7aa6c9; --next-ink:#2c5f86;
  --ok:#1f6a36; --warn:#8f2626; --accent:#2c5f86;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a1f; --ink:#e7edf2; --muted:#9aa8b3; --line:#2b353d; --card:#1b232a;
    --win:#1f3a28; --win-ink:#9fe0b0;
    --loss:#442323; --loss-ink:#f2aaaa;
    --draw:#3a3324; --draw-ink:#e6d3a6;
    --next:#1b232a; --next-edge:#5b8db5; --next-ink:#a9cdea;
    --ok:#9fe0b0; --warn:#f2aaaa; --accent:#a9cdea;
  }
}
:root[data-theme="dark"]{
  --bg:#141a1f; --ink:#e7edf2; --muted:#9aa8b3; --line:#2b353d; --card:#1b232a;
  --win:#1f3a28; --win-ink:#9fe0b0; --loss:#442323; --loss-ink:#f2aaaa;
  --draw:#3a3324; --draw-ink:#e6d3a6; --next:#1b232a; --next-edge:#5b8db5; --next-ink:#a9cdea;
  --ok:#9fe0b0; --warn:#f2aaaa; --accent:#a9cdea;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:28px 18px 48px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(2rem,6vw,2.9rem)}
.sub{color:var(--muted);margin:.35rem 0 1.4rem}
.record{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:1.6rem;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.record div{font-size:1.05rem;color:var(--muted)}
.record b{display:block;font-size:2.2rem;line-height:1;color:var(--ink);font-weight:700}
h2{font-size:1.6rem;margin:2.2rem 0 .7rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
.rec{white-space:nowrap;font-variant-numeric:tabular-nums}
.rec small{color:var(--muted);margin-left:4px}
tr.us td{background:var(--win);font-weight:600}
.stand td,.stand th{text-align:right}
.stand td:nth-child(2),.stand th:nth-child(2){text-align:left}
th,td{padding:10px 12px;text-align:left;vertical-align:middle}
th{font-weight:600;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.date{white-space:nowrap;font-variant-numeric:tabular-nums}
.opp{font-weight:600}
.score{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.35rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;min-width:1.7em;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem;border-radius:5px;padding:0 6px;margin-right:8px}
tr.W{background:var(--win)}  tr.W .tag{background:var(--win-ink);color:var(--win)}
tr.L{background:var(--loss)} tr.L .tag{background:var(--loss-ink);color:var(--loss)}
tr.D{background:var(--draw)} tr.D .tag{background:var(--draw-ink);color:var(--draw)}
tr.toggle td{padding:0;background:var(--card)}
tr.toggle button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;gap:10px;align-items:baseline;padding:12px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;color:var(--win-ink)}
tr.toggle button::before{content:"▸";color:var(--muted);transition:transform .15s}
tr.toggle button[aria-expanded="true"]::before{transform:rotate(90deg)}
tr.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.toggle .smeta{font-family:"Source Sans 3",sans-serif;font-weight:400;font-size:.92rem}
@media (prefers-reduced-motion:reduce){tr.toggle button::before{transition:none}}
table.collapsed tr.past{display:none}
tr.divider td{padding:14px 12px 6px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;color:var(--next-ink);background:var(--card)}
tr.up{background:var(--next)}
tr.up td:first-child{box-shadow:inset 4px 0 0 var(--next-edge)}
tr.up .score{color:var(--next-ink);font-size:1.1rem}
.venue{color:var(--muted);font-size:.92rem}
.repeat{display:inline-block;margin-left:6px;font-size:.78rem;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.checks{display:grid;gap:10px;margin-top:.4rem}
.verdict{padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.verdict strong{color:var(--ok)}
.verdict.bad strong{color:var(--warn)}
ul.teams{list-style:none;padding:0;margin:.4rem 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px}
ul.teams li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0}
.st{font-size:.88rem;color:var(--muted);white-space:nowrap}
.st.p{color:var(--ok)} .st.s{color:var(--accent)} .st.x{color:var(--warn);font-weight:600}
.note{color:var(--muted);font-size:.92rem;margin-top:.8rem}
@media (max-width:520px){ main{padding:20px 12px 40px} th,td{padding:9px 9px} }
details.scout{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.scout summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;list-style:none}
details.scout summary::-webkit-details-marker{display:none}
details.scout summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.scout[open] summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details.scout summary::before{transition:none}}
details.scout summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem}
.smeta{color:var(--muted);font-size:.92rem}
.sbody{padding:0 14px 14px}
.sbody h3{font-size:.95rem;font-weight:600;margin:12px 0 6px;color:var(--muted)}
.mini{width:100%;border-collapse:collapse;min-width:0}
.mini td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:.95rem}
.mini tr:last-child td{border-bottom:0}
.mini .tag{font-size:.85rem}
.mini tr.W td:first-child{box-shadow:inset 3px 0 0 var(--win-ink)}
.mini tr.L td:first-child{box-shadow:inset 3px 0 0 var(--loss-ink)}
.mini tr.D td:first-child{box-shadow:inset 3px 0 0 var(--draw-ink)}
.mini tr.W,.mini tr.L,.mini tr.D{background:none}
.cmp{margin:0;padding-left:1.1em}
.cmp li{margin:3px 0}
a.jump{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.ladder{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-.6rem 0 1.4rem;color:var(--muted);font-size:.95rem}
.tierwrap{position:relative;display:inline-block}
.tierchip{font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px}
.tierchip.mine{border-color:var(--win-ink);color:var(--win-ink)}
.tierchip:focus-visible,.oppbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop{display:none;position:absolute;z-index:5;left:0;top:calc(100% + 6px);width:min(320px,80vw);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:10px 12px;color:var(--ink);font-size:.88rem;text-align:left}
.tierwrap:hover .pop,.tierwrap.open .pop{display:block}
.pop b{display:block;font-size:.92rem;margin-bottom:4px}
.pop ol{margin:0;padding-left:1.3em}
.pop li{padding:1px 0}
.pop li span{color:var(--muted);margin-left:4px}
.pop li.hl{font-weight:600;color:var(--accent)}
.pop li.me{font-weight:600;color:var(--win-ink)}
.oppbtn{all:unset;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.oppbtn::after{content:" ▾";color:var(--muted);font-size:.8em}
.oppbtn[aria-expanded="true"]::after{content:" ▴"}
tr.ctx td{padding:4px 8px 12px;font-size:.92rem;color:var(--muted);border-bottom:1px solid var(--line)}
tr.ctx[hidden]{display:none}
tr.ctx p{margin:0 0 6px}
mark.heat{color:inherit;padding:1px 3px;margin:0 -3px;border-radius:3px;
  background:linear-gradient(transparent 38%, rgba(255,170,0,var(--h)) 38%, rgba(255,140,0,var(--h)) 92%, transparent 92%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark.heat{background:linear-gradient(transparent 38%, rgba(255,160,40,calc(var(--h)*.55)) 38%, rgba(255,120,30,calc(var(--h)*.55)) 92%, transparent 92%)}}
:root[data-theme="dark"] mark.heat{background:linear-gradient(transparent 38%, rgba(255,160,40,calc(var(--h)*.55)) 38%, rgba(255,120,30,calc(var(--h)*.55)) 92%, transparent 92%)}
.edge{font-weight:600}
.e-g{color:#1f6a36}.e-y{color:#9a6b00}.e-o{color:#c2570c}.e-r{color:#b42318}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .e-g{color:#8fdca5}:root:not([data-theme="light"]) .e-y{color:#f2cf5b}:root:not([data-theme="light"]) .e-o{color:#ffa45c}:root:not([data-theme="light"]) .e-r{color:#ff8a80}}
:root[data-theme="dark"] .e-g{color:#8fdca5}:root[data-theme="dark"] .e-y{color:#f2cf5b}:root[data-theme="dark"] .e-o{color:#ffa45c}:root[data-theme="dark"] .e-r{color:#ff8a80}

/* Team identity: one color per team, used for the header band, our standings row and our bracket chip */
:root{--team:#13284b;--team-ink:#b8914f;--team-sub:rgba(241,230,196,.85);--team-stripe:#b8914f;--team-soft:#f6edcf;--team-accent:#7a5a24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--team-soft:#3a321a;--team-accent:#b8914f}}
:root[data-theme="dark"]{--team-soft:#3a321a;--team-accent:#b8914f}
.band{background:var(--team);color:var(--team-ink);border-radius:12px;padding:18px 20px 16px;margin-bottom:1.6rem;border-bottom:6px solid var(--team-stripe)}
.band h1{color:var(--team-ink)}
.band .sub{color:var(--team-sub);margin:.4rem 0 0}
tr.us td{background:var(--team-soft)}
.tierchip.mine{border-color:var(--team-accent);color:var(--team-accent)}
.pop li.me{color:var(--team-accent)}
.back{display:inline-block;margin-bottom:.7rem;color:var(--muted);text-decoration:none;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.02em}
.back:hover{color:var(--ink)}

/* Page identity: each team page gets its own background; cards keep the shared palette */
:root{--page-bg:#13284b;--page-ink:#f3ead0;--page-muted:#bca57e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#0c1a33;--page-ink:#f3ead0;--page-muted:#bca57e}}
:root[data-theme="dark"]{--page-bg:#0c1a33;--page-ink:#f3ead0;--page-muted:#bca57e}
body{background:var(--page-bg);color:var(--page-ink)}
.scroll,details.scout,.pop{color:var(--ink)}
.record div,.ladder,.note,.back{color:var(--page-muted)}
.record b,.back:hover{color:var(--page-ink)}
.band{background:#0a1830}

/* Matchup highlight under the opponent's name: green strong edge, yellow edge, orange toss-up, red tough */
mark.mu{color:inherit;padding:1px 3px;margin:0 -3px;border-radius:3px;background:linear-gradient(transparent 38%,var(--mu) 38%,var(--mu) 92%,transparent 92%)}
mark.mu-g{--mu:rgba(46,160,80,.42)}mark.mu-y{--mu:rgba(242,201,76,.62)}mark.mu-o{--mu:rgba(232,116,42,.45)}mark.mu-r{--mu:rgba(200,40,30,.40)}
mark.mu-g.faint{--mu:rgba(46,160,80,.2)}mark.mu-y.faint{--mu:rgba(242,201,76,.3)}mark.mu-o.faint{--mu:rgba(232,116,42,.22)}mark.mu-r.faint{--mu:rgba(200,40,30,.2)}
tr.up.fv-g td:first-child{box-shadow:inset 4px 0 0 rgba(46,160,80,.75)}tr.up.fv-y td:first-child{box-shadow:inset 4px 0 0 rgba(242,201,76,.9)}
tr.up.fv-o td:first-child{box-shadow:inset 4px 0 0 rgba(232,116,42,.8)}tr.up.fv-r td:first-child{box-shadow:inset 4px 0 0 rgba(200,40,30,.75)}
</style>
</head>
<body>
<main>
  <header class="band">
    <h1>FC Westlake Elite Central White GU12</h1>
    <p class="sub">Pre-ECNL squad. STXCL Western Conference 2026–27, Girls U12 Bracket B (Tier 2). League results from GotSport as of Oct 3, 2026.</p>
  </header>
  <div class="ladder" id="ladder"></div>
  <div class="record" id="record"></div>

  <div class="scroll">
    <table id="season" class="collapsed">
      <thead><tr><th>Date</th><th>Opponent</th><th>Their record</th><th>Score / kickoff</th><th>Venue</th></tr></thead>
      <tbody id="grid"></tbody>
    </table>
  </div>

  <h2>Tournaments</h2>
  <div id="tournaments"></div>

  <h2>Upcoming</h2>
  <div id="scouting"></div>

  <h2>Bracket B standings</h2>
  <div class="scroll">
    <table class="stand">
      <thead><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>L</th><th>D</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
      <tbody id="standings"></tbody>
    </table>
  </div>

</main>

<script>
const US = "FC Westlake Elite Central White";
const strip = s => s.replace(/\s*STXCL[- ]WC GU12.*$/,"").trim();
const key = s => strip(s).toLowerCase();
const same = (a,b) => key(a)===key(b);

// Every Bracket B match played so far (GotSport, as of Oct 2 2026). Scores home–away.
const results = [
  ["2026-09-12","FC Westlake Elite Central White",7,0,"Lonestar ATX Silver NTH"],
  ["2026-09-12","Lonestar ATX Gold NTH",2,1,"HC United Walther"],
  ["2026-09-12","SA United Platinum",0,5,"LTFC Premier II"],
  ["2026-09-12","Coyotes FC Navy",0,0,"Lonestar ATX Royal STH"],
  ["2026-09-13","FC Westlake North",1,3,"LTFC Premier II"],
  ["2026-09-13","SA United Platinum",3,1,"Lonestar ATX Royal STH"],
  ["2026-09-18","Lonestar ATX White NTH",0,8,"TC PREMIER SC"],
  ["2026-09-19","LTFC Premier II",2,1,"FC Westlake Elite Central White"],
  ["2026-09-19","TC PREMIER SC",3,1,"SA United Platinum"],
  ["2026-09-20","Lonestar ATX Silver NTH",0,8,"FC Westlake North"],
  ["2026-09-20","Coyotes FC Navy",3,1,"Lonestar ATX Gold NTH"],
  ["2026-09-20","Lonestar ATX Royal STH",3,1,"Lonestar ATX White NTH"],
  ["2026-09-25","Lonestar ATX White NTH",1,0,"Lonestar ATX Silver NTH"],
  ["2026-09-26","HC United Walther",0,4,"Lonestar ATX Royal STH"],
  ["2026-09-26","Coyotes FC Navy",2,2,"LTFC Premier II"],
  ["2026-09-27","FC Westlake Elite Central White",4,0,"TC PREMIER SC"],
].map(([date,home,hs,as,away])=>({date,home,hs,as,away}));

const upcoming = [
  {date:null, time:"TBD", opp:"FC Westlake North", venue:"TBD"},
  {date:"2026-10-17", time:"11:00 AM", opp:"Lonestar ATX White NTH", venue:"Westcreek, Field 3W"},
  {date:"2026-10-18", time:"1:00 PM", opp:"Lonestar ATX Royal STH", venue:"Westcreek, Field 4W",
    note:"Beat FC Westlake Central White 3–1 in the Labor Day Cup final (U12G Bronze A)."},
  {date:"2026-10-24", time:"2:30 PM", opp:"SA United Platinum", venue:"Bridge Point, Field 1"},
  {date:"2026-10-31", time:"11:00 AM", opp:"Lonestar ATX Gold NTH", venue:"Westcreek, Field 4E"},
  {date:"2026-11-07", time:"2:30 PM", opp:"Coyotes FC Navy", venue:"St Francis School, Field 1B"},
  {date:"2026-11-21", time:"1:00 PM", opp:"HC United Walther", venue:"St Francis School, Field 1B"},
];
const bracket = [
  "Coyotes FC Navy","FC Westlake Elite Central White","FC Westlake North","HC United Walther",
  "Lonestar ATX Gold NTH","Lonestar ATX Royal STH","Lonestar ATX Silver NTH","Lonestar ATX White NTH",
  "LTFC Premier II","SA United Platinum","TC PREMIER SC"
];

const fmt = d => !d ? "TBD" : new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtS = d => !d ? "TBD" : new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => key(s).replace(/[^a-z0-9]+/g,"-");
const ord = n => n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:n%10]||"th");
const res = (f,a) => f>a?"W":f<a?"L":"D";

// A team's games from its own perspective
const gamesOf = team => results.filter(m=>same(m.home,team)||same(m.away,team)).map(m=>{
  const home = same(m.home,team);
  return {date:m.date, opp: home?m.away:m.home, f: home?m.hs:m.as, a: home?m.as:m.hs};
});
const scored = g => g.f!==null;

// Standings computed from results
const table = bracket.map(t=>{
  const g = gamesOf(t).filter(scored);
  const w=g.filter(x=>x.f>x.a).length, l=g.filter(x=>x.f<x.a).length, d=g.filter(x=>x.f===x.a).length;
  const gf=g.reduce((s,x)=>s+x.f,0), ga=g.reduce((s,x)=>s+x.a,0);
  return {team:t, mp:g.length, w,l,d,gf,ga,gd:gf-ga,pts:w*3+d};
}).sort((a,b)=>((b.mp?b.pts/b.mp:0)-(a.mp?a.pts/a.mp:0))||b.gd-a.gd||b.gf-a.gf); // GotSport ranks by points per game
const pos = t => table.findIndex(r=>same(r.team,t))+1;
const rowOf = t => table.find(r=>same(r.team,t));
const recTd = t => { const r=rowOf(t); return r?`<td class="rec">${r.w}-${r.l}-${r.d}<small>${ord(pos(t))}</small></td>`:"<td class=\"rec\">—</td>"; };

// Matchup favorability (goals). Positive favors us.
const capM = m => Math.max(-5, Math.min(5, m));
function matchup(t){
  const us = gamesOf(US).filter(scored), them = gamesOf(t).filter(scored);
  let sum=0, w=0, n=0;
  us.filter(x=>same(x.opp,t)).forEach(x=>{ sum+=2*capM(x.f-x.a); w+=2; n++; }); // head-to-head counts double
  them.filter(x=>!same(x.opp,US)).forEach(x=>us.filter(y=>same(y.opp,x.opp)).forEach(y=>{ sum+=capM((y.f-y.a)-(x.f-x.a)); w+=1; n++; }));
  if(w) return {s:sum/w, n, form:false};
  const a=rowOf(US), b=rowOf(t);
  if(a&&b&&a.mp&&b.mp) return {s:capM(a.gd/a.mp-b.gd/b.mp), n:0, form:true};
  return null;
}
const band = s => s>=3?"g":s>=1?"y":s>-1?"o":"r";
const muMark = (t,m) => m ? `<mark class="mu mu-${band(m.s)}${m.form?" faint":""}">${esc(t)}</mark>` : esc(t);

// Main grid
const ours = gamesOf(US).filter(scored).sort((a,b)=>a.date.localeCompare(b.date));
const playedKeys = new Set(ours.map(g=>key(g.opp)));
let rows = `<tr class="toggle"><td colspan="5"><button type="button" id="pastToggle" aria-expanded="false">Results <span class="smeta">${ours.length} played, ${ours.filter(g=>g.f>g.a).length}-${ours.filter(g=>g.f<g.a).length}-${ours.filter(g=>g.f===g.a).length}. Show games</span></button></td></tr>`;
rows += ours.map(g=>{ const r=res(g.f,g.a);
  return `<tr class="${r} past"><td class="date">${fmt(g.date)}</td><td class="opp">${esc(g.opp)}</td>${recTd(g.opp)}
    <td class="score"><span class="tag">${r}</span>${g.f}–${g.a}</td><td class="venue">—</td></tr>`; }).join("");
rows += `<tr class="divider"><td colspan="5">Upcoming</td></tr>`;
// Highlight strength from opponent points per game (0–3), eased so strong teams stand out
const heat = t => { const r=rowOf(t); if(!r||!r.mp) return 0; const ppg=r.pts/r.mp; return Math.pow(Math.min(ppg,3)/3,1.5); };
upcoming.sort((a,b)=>(a.date?0:1)-(b.date?0:1)||(a.date||"").localeCompare(b.date||""));
rows += upcoming.map(g=>{
  const rep = playedKeys.has(key(g.opp)) ? `<span class="repeat">Rematch</span>` : "";
  const m = matchup(g.opp);
  return `<tr class="up${m?` fv-${band(m.s)}`:""}"><td class="date">${fmt(g.date)}</td><td class="opp"><a class="jump" href="#scout-${slug(g.opp)}" title="${(()=>{const r=rowOf(g.opp);return r&&r.mp?(r.pts/r.mp).toFixed(2)+" points per game":"No games yet"})()}">${muMark(g.opp,m)}</a>${rep}</td>${recTd(g.opp)}
    <td class="score">${g.time}</td><td class="venue">${esc(g.venue)}</td></tr>`; }).join("");
document.getElementById("grid").innerHTML = rows;
document.getElementById("pastToggle").addEventListener("click",e=>{
  const b=e.currentTarget, open=b.getAttribute("aria-expanded")!=="true";
  b.setAttribute("aria-expanded",open);
  document.getElementById("season").classList.toggle("collapsed",!open);
  b.querySelector(".smeta").textContent=b.querySelector(".smeta").textContent.replace(open?"Show games":"Hide games",open?"Hide games":"Show games");
});

// Scouting
const ourVs = t => ours.find(g=>same(g.opp,t));
document.getElementById("scouting").innerHTML = upcoming.map((u,i)=>{
  const t=u.opp, r=rowOf(t), g=gamesOf(t).sort((a,b)=>a.date.localeCompare(b.date));
  const list = g.map(x=>{
    if(!scored(x)) return `<tr><td>${fmtS(x.date)}</td><td>vs ${esc(x.opp)}</td><td class="smeta">No score reported</td></tr>`;
    const rr=res(x.f,x.a);
    return `<tr class="${rr}"><td>${fmtS(x.date)}</td><td>vs ${esc(x.opp)} <span class="smeta">(${ord(pos(x.opp))})</span></td><td class="score"><span class="tag" style="background:var(--${rr==="W"?"win":rr==="L"?"loss":"draw"}-ink);color:var(--card)">${rr}</span>${x.f}–${x.a}</td></tr>`;
  }).join("");
  const common = g.filter(x=>scored(x)&&!same(x.opp,US)&&ourVs(x.opp)).map(x=>{
    const o=ourVs(x.opp);
    const v=(f,a)=>f>a?"won":f<a?"lost":"drew";
    // Edge = our goal difference vs theirs against the same team
    const edge=(o.f-o.a)-(x.f-x.a);
    const cls="e-"+band(edge);
    const tip=edge===0?"Even against this opponent":`${Math.abs(edge)}-goal edge to ${edge>0?"us":"them"} against this opponent`;
    return `<li>${esc(x.opp)}: <span class="edge ${cls}" title="${tip}">We ${v(o.f,o.a)} ${o.f}–${o.a}; they ${v(x.f,x.a)} ${x.f}–${x.a}.</span></li>`;
  }).join("");
  return `<details class="scout" id="scout-${slug(t)}"${i===0?" open":""}>
    <summary><span class="sname">${esc(t)}</span><span class="smeta">${fmt(u.date)}, ${u.time}. ${r.w}-${r.l}-${r.d}, ${ord(pos(t))}, GF ${r.gf} GA ${r.ga}</span></summary>
    <div class="sbody">
      ${u.note?`<p class="smeta" style="margin:0">${esc(u.note)}</p>`:""}
      <h3>Their results</h3>
      ${g.length?`<table class="mini"><tbody>${list}</tbody></table>`:`<p class="smeta">No games played yet.</p>`}
      <h3>Common opponents</h3>
      ${common?`<ul class="cmp">${common}</ul>`:`<p class="smeta">None yet.</p>`}
    </div></details>`;
}).join("");
document.querySelectorAll("a.jump").forEach(a=>a.addEventListener("click",()=>{
  const d=document.querySelector(a.getAttribute("href")); if(d) d.open=true; }));

// League tiers (GotSport, Sep 30 2026). [team, W-L-D] in standings order.
const tiers = {
  "WC-A": {conf:"STXCL Western Conference", name:"Girls U12 Bracket A", tier:"Tier 1 of 3", teams:[
    ["Lonestar ATX Red STH","4-0-0"],["Lonestar SAT Red","4-0-1"],["FC Westlake Elite North White","2-0-1"],["Lonestar ATX Red NW A","2-0-1"],
    ["Lonestar ATX Red NW B","2-2-0"],["SA City SC Red","1-1-1"],["Premier FA","1-2-1"],["Lonestar SAT Royal","1-4-1"],
    ["Lonestar ATX Red NW C","1-4-0"],["Sting CC Clitnovici","0-1-0"],["Lonestar ATX Royal NTH","0-4-0"]]},
  "WC-B": {conf:"STXCL Western Conference", name:"Girls U12 Bracket B", tier:"Tier 2 of 3", teams:null}, // filled from live table
  "WC-C": {conf:"STXCL Western Conference", name:"Girls U12 Bracket C", tier:"Tier 3 of 3", teams:[
    ["FC Westlake Central White","4-0-0"],["LTFC Red","3-0-0"],["LIONS FC","3-1-0"],["Castroville United","3-1-0"],
    ["FC Westlake Central Blue","2-1-1"],["DS Stars","1-1-2"],["Pflugerville FC Green","0-0-2"],["BLACK LIONS FC LIONESSES","0-2-1"],
    ["Coyotes FC White","0-3-0"],["SA City SC Blue","0-3-0"],["CTX Soccer Academy Spark","0-4-0"]]},
  "EC-U11-D": {conf:"STXCL Eastern Conference", name:"Girls U11 Bracket D", tier:"Bracket D of 4", teams:[
    ["Challenge Aggieland White","3-0-0"],["Coastal Premier II","2-0-1"],["AHFC West Premier II","2-1-0"],["HTX South White","2-1-0"],
    ["HTX Sienna Gold","1-0-2"],["AHFC SW Blue","1-1-1"],["Challenge East Red","1-2-0"],["Kaptiva Sports Academy TX Purple","0-2-1"],
    ["RISE SC Nike Volt GU10","0-2-1"],["Dynamos","0-3-0"]]},
};
tiers["WC-B"].teams = table.map(r=>[strip(r.team), `${r.w}-${r.l}-${r.d}`]);
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");
const tierChip = (k, highlight, mine) => {
  const t=tiers[k];
  const items=t.teams.map(([n,rec])=>{
    const cls = norm(n)===norm(strip(US)) ? "me" : (highlight && norm(n)===norm(highlight) ? "hl" : "");
    return `<li class="${cls}">${esc(n)}<span>${rec}</span></li>`;}).join("");
  return `<span class="tierwrap"><button type="button" class="tierchip${mine?" mine":""}" aria-expanded="false">${esc(t.name.replace("Girls ",""))}, ${t.tier}</button>
    <span class="pop" role="tooltip"><b>${esc(t.conf)}: ${esc(t.name)}</b><ol>${items}</ol></span></span>`;
};
document.getElementById("ladder").innerHTML = `League tiers:` +
  ["WC-A","WC-B","WC-C"].map(k=>tierChip(k,null,k==="WC-B")).join("");

// Tournaments. Scores ours first. tier: key into tiers, or null with a note.
const tournaments = [
  {name:"Austin Labor Day Cup", dates:"Sep 5–6, 2026", division:"U12G Gold, the top division. Registered as FC Westlake Central Pre-ECNL GU12 White.", finish:"Did not advance",
   games:[
    {date:"2026-09-05", round:"Group", opp:"Challenge STXCL EC G2014/15", f:1, a:6,
      tier:null, note:"Challenge's STXCL Eastern Conference team. Bracket not checked yet."},
    {date:"2026-09-05", round:"Group", opp:"RISE SC Pre GA U12", f:0, a:1,
      tier:null, note:"RISE SC's Pre-Girls Academy squad. Not in any STXCL Western Conference Girls U12 bracket."},
    {date:"2026-09-06", round:"Group", opp:"Sonny G Academy U12 14/15 Inspire", f:0, a:4,
      tier:null, note:"Went on to win the U12G Gold division."},
   ]},
  {name:"Pre-Labor Day", dates:"Aug 29–30, 2026", division:"STAR Soccer Complex. Division not confirmed yet.", finish:"Out in the quarterfinal",
   games:[
    {date:"2026-08-29", round:"Group", opp:"Lion Kings FC 2014/2015 Girls", f:3, a:5,
      tier:null, note:"Not in any STXCL Western Conference Girls U12 bracket. Likely plays in a different league."},
    {date:"2026-08-30", round:"Group", opp:"Lonestar ATX Red STH STXCL-WC GU12", f:0, a:3,
      tier:"WC-A", as:"Lonestar ATX Red STH", note:"Leads Bracket A, one tier above us."},
    {date:"2026-08-30", round:"QF", opp:"Lonestar ATX Red STH STXCL-WC GU12", f:0, a:2,
      tier:"WC-A", as:"Lonestar ATX Red STH", note:"Same opponent again, two and a half hours later."},
   ]},
];
document.getElementById("tournaments").innerHTML = tournaments.map(t=>{
  const w=t.games.filter(g=>g.f>g.a).length, l=t.games.filter(g=>g.f<g.a).length, d=t.games.filter(g=>g.f===g.a).length;
  const gf=t.games.reduce((s,g)=>s+g.f,0), ga=t.games.reduce((s,g)=>s+g.a,0);
  const rows=t.games.map((g,gi)=>{const r=res(g.f,g.a), id=`ctx-${slug(t.name)}-${gi}`;
    let ctx;
    if(g.tier){ const tt=tiers[g.tier], i=tt.teams.findIndex(x=>norm(x[0])===norm(g.as));
      const line = i>=0 ? `${tt.teams[i][1]}, ${ord(i+1)} of ${tt.teams.length}` : "";
      ctx = `<p>${esc(tt.conf)}, ${esc(tt.name)}${line?`: ${line}`:""}. ${esc(g.note)}</p>${tierChip(g.tier,g.as,false)}`;
    } else ctx = `<p>${esc(g.note)}</p>`;
    return `<tr class="${r}"><td>${fmtS(g.date)}</td><td>${g.round}</td><td><button type="button" class="oppbtn" aria-expanded="false" aria-controls="${id}">vs ${esc(g.opp)}</button></td><td class="score"><span class="tag" style="background:var(--${r==="W"?"win":r==="L"?"loss":"draw"}-ink);color:var(--card)">${r}</span>${g.f}–${g.a}</td></tr>
      <tr class="ctx" id="${id}" hidden><td colspan="4">${ctx}</td></tr>`;}).join("");
  return `<details class="scout"><summary><span class="sname">${esc(t.name)}</span><span class="smeta">${t.dates}. ${esc(t.finish)}. ${w}-${l}-${d}, ${gf}–${ga}</span></summary>
    <div class="sbody"><h3>${esc(t.division)}</h3><table class="mini"><tbody>${rows}</tbody></table></div></details>`;
}).join("");

document.addEventListener("click",e=>{
  const ob=e.target.closest(".oppbtn");
  if(ob){ const open=ob.getAttribute("aria-expanded")!=="true"; ob.setAttribute("aria-expanded",open);
    document.getElementById(ob.getAttribute("aria-controls")).hidden=!open; return; }
  const chip=e.target.closest(".tierchip");
  document.querySelectorAll(".tierwrap.open").forEach(w=>{ if(!chip||w!==chip.parentElement){w.classList.remove("open");w.querySelector(".tierchip").setAttribute("aria-expanded","false");}});
  if(chip){ const w=chip.parentElement, open=!w.classList.contains("open"); w.classList.toggle("open",open); chip.setAttribute("aria-expanded",open); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.querySelectorAll(".tierwrap.open").forEach(w=>w.classList.remove("open")); });

// Record strip
const me = rowOf(US);
document.getElementById("record").innerHTML =
  `<div><b>${me.w}-${me.l}-${me.d}</b>League W-L-D</div><div><b>${ord(pos(US))}</b>In bracket</div><div><b>${me.gf}–${me.ga}</b>Goals for–against</div><div><b>${upcoming.length}</b>Games left</div>` + (()=>{
    const tg=tournaments.flatMap(t=>t.games);
    const w=me.w+tg.filter(g=>g.f>g.a).length, l=me.l+tg.filter(g=>g.f<g.a).length, d=me.d+tg.filter(g=>g.f===g.a).length;
    return `<div><b>${w}-${l}-${d}</b>Incl. tournaments</div>`; })();

// Standings
document.getElementById("standings").innerHTML = table.map((r,i)=>
  `<tr class="${same(r.team,US)?"us":""}"><td>${i+1}</td><td>${esc(r.team)}</td><td>${r.mp}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?"+":""}${r.gd}</td><td>${r.pts}</td></tr>`).join("");

</script>
</body>
